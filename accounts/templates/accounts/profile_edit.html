{% extends "base.html" %}
{% block title %}Edit Profile · BasuraOras{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
    {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
    <button type="submit" class="btn">Save changes</button>
    <a href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
