{% extends "base.html" %}
{% block title %}{{ title }} · BasuraOras{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
    {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'pickups:schedule_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
